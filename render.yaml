# ═══════════════════════════════════════════════════════════════════════════
#  Render Blueprint — BẢN MIỄN PHÍ ($0/tháng)
#
#  Khác bản trả phí (render.yaml):
#    • KHÔNG có khối `databases:` → dùng Neon Postgres free (không hết hạn)
#      thay cho Postgres free của Render (hết hạn sau 30 ngày, xoá sạch data)
#    • KHÔNG có service `type: cron` → Render không có gói cron miễn phí;
#      GitHub Actions (.github/workflows/scrape.yml) làm thay, miễn phí
#    • plan: free → 512 MB RAM, TỰ NGỦ sau 15 phút không có traffic,
#      lần mở lại mất ~1 phút
#
#  ⚠️ Với plan free, PHẢI tắt scraper dùng Playwright (nguồn `slb`) —
#     512 MB không đủ cho Chromium. Xem docs/GO-LIVE-FREE.md bước 1.
#
#  CÁCH DÙNG:
#     1. Đổi tên file này thành `render.yaml` (Render chỉ đọc đúng tên đó)
#        — nhớ đổi tên/xoá file render.yaml cũ trước.
#     2. Render Dashboard → New → Blueprint → chọn repo → Apply
#     3. Render sẽ hỏi 2 giá trị: DATABASE_URL (Neon) và CORS_ORIGINS
#
#  Hướng dẫn đầy đủ: docs/GO-LIVE-FREE.md
# ═══════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: og-api
    runtime: docker
    region: singapore # oregon | frankfurt | singapore — KHÔNG đổi được sau khi tạo
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: . # build context = gốc repo (Dockerfile COPY packages/shared)
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    # Đường dẫn luôn tính từ gốc repo. Sửa frontend không làm rebuild backend.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tsconfig.base.json
      ignoredPaths:
        - apps/web/**
        - docs/**
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️ KHÔNG đặt API_PORT — Render cấp cổng qua biến PORT (mặc định 10000).
      - key: API_PREFIX
        value: api/v1
      # Render hỏi giá trị khi tạo Blueprint. Dán chuỗi kết nối Neon
      # (bản CÓ `-pooler` để tiết kiệm kết nối trên gói 512 MB).
      - key: DATABASE_URL
        sync: false
      # Render tự sinh chuỗi ngẫu nhiên 256-bit ở lần tạo đầu.
      # Xem tại: Dashboard → og-api → Environment
      - key: ADMIN_API_KEY
        generateValue: true
      # Render hỏi giá trị. Tạm nhập `*`, sau khi có domain Vercel thì sửa lại.
      - key: CORS_ORIGINS
        sync: false
      - key: THROTTLE_TTL
        value: '60'
      - key: THROTTLE_LIMIT
        value: '120'
      # Bật để vẫn gọi được /scrape/run thủ công. Lịch tự động do GitHub Actions lo.
      - key: SCRAPER_ENABLED
        value: 'true'
      - key: SCRAPER_CONCURRENCY
        value: '1'
      - key: SCRAPER_MAX_PAGES
        value: '3'
      - key: SCRAPER_REQUEST_DELAY_MS
        value: '2500'
      # ⚠️ Đổi thành domain + email liên hệ thật của bạn
      - key: SCRAPER_USER_AGENT
        value: 'OGJobsBot/1.0 (+https://github.com/minhdung8797-ak/oilgas-jobs-app)'
      - key: PLAYWRIGHT_HEADLESS
        value: 'true'
      - key: CRON_ENABLED
        value: 'false'
      - key: JOB_TTL_DAYS
        value: '60'
      - key: CLASSIFIER_MIN_SCORE
        value: '6'
      - key: CLASSIFIER_MIN_MARGIN
        value: '2'
      - key: HF_ENABLED
        value: 'false'
