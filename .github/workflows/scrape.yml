name: Cập nhật việc làm hằng ngày

# ═══════════════════════════════════════════════════════════════════════════
#  Cron MIỄN PHÍ bằng GitHub Actions.
#
#  Chạy scraper rồi ghi thẳng vào Neon Postgres. KHÔNG đi qua API trên Render,
#  nên không phụ thuộc việc API có đang ngủ hay không — đây là lý do đặt cron ở
#  đây thay vì dùng SchedulerService bên trong API.
#
#  Chi phí: repo public -> miễn phí không giới hạn phút.
#
#  ⚠️ GitHub TẮT lịch chạy tự động sau 60 ngày repo không có hoạt động nào.
#     Vào tab Actions bấm "Enable workflow" để bật lại. Chỉ cần một commit bất
#     kỳ trong 60 ngày là đủ để giữ lịch sống.
#
#  CẦN CÓ SECRET (Settings -> Secrets and variables -> Actions):
#
#     Tên   : DATABASE_URL
#     Giá trị: dán ĐÚNG chuỗi kết nối, dạng như dưới đây và không gì khác —
#              không kèm chữ mô tả, không "psql ", không dấu nháy:
#
#         postgresql://<user>:<password>@ep-xxxx.<region>.aws.neon.tech/neondb?sslmode=require
#
#     Lấy ở Neon: Dashboard -> Connection string -> BỎ CHỌN "Pooled connection".
#     Prisma migrate cần kết nối trực tiếp; chuỗi có "-pooler" gây lỗi P1002.
#     Phải là cùng database mà Render đang dùng, nếu không job sẽ ghi vào một
#     database khác và trang web không thấy dữ liệu mới.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 03:15 UTC = 10:15 giờ Việt Nam. GitHub Actions luôn dùng UTC.
    # Giờ lẻ là cố ý: đúng đầu giờ có hàng triệu workflow cùng xếp hàng, dễ trễ.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Chạy 1 nguồn cụ thể (bỏ trống = tất cả nguồn đang bật)'
        required: false
        type: string
      with_playwright:
        description: 'Cài Chromium cho nguồn dùng Playwright (chậm thêm ~2 phút)'
        required: false
        type: boolean
        default: false
      setup_only:
        description: 'Chỉ tạo bảng + nạp dữ liệu nền, KHÔNG thu thập job'
        required: false
        type: boolean
        default: false

# Không cho 2 lần chạy chồng nhau: hai tiến trình cùng ghi vào một database sẽ
# tạo bản ghi trùng và làm nguồn chặn IP vì gọi quá dày.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      SCRAPER_ENABLED: 'true'
      SCRAPER_CONCURRENCY: '2'
      SCRAPER_MAX_PAGES: '5'
      SCRAPER_REQUEST_DELAY_MS: '2500'
      SCRAPER_USER_AGENT: 'OGJobsBot/1.0 (+https://github.com/minhdung8797-ak/oilgas-jobs-app)'
      PLAYWRIGHT_HEADLESS: 'true'
      CRON_ENABLED: 'false'
      CLASSIFIER_MIN_SCORE: '6'
      CLASSIFIER_MIN_MARGIN: '2'
      HF_ENABLED: 'false'
      JOB_TTL_DAYS: '60'
      # KHÔNG ép bật aramco ở đây. Đã thử và đã có câu trả lời dứt khoát:
      #
      #     30/08 17:58  Render          1131361ms  found=0
      #     30/08 23:54  Render          1127764ms  found=0
      #     01/09 07:03  GitHub Actions  1126472ms  found=0
      #     (đối chiếu)  halliburton       96787ms  found=25
      #
      # Ba lần treo gần bằng nhau tới từng chục giây rồi trả rỗng — dải IP của
      # Actions bị chặn y như Render. Giả thuyết "đổi hạ tầng thì vào được" sai.
      # Bật lại chỉ tốn 19 trong 30 phút ngân sách mỗi lần chạy để lấy về số 0,
      # và có nguy cơ làm cả job hết giờ.
      #
      # Bài học chung: mở được portal bằng trình duyệt ở nhà KHÔNG chứng minh
      # scraper trên máy chủ vào được — đó là hai dải IP khác nhau.
      # SCRAPER_FORCE_SOURCES: 'aramco'

    steps:
      # Kiểm tra HÌNH DẠNG của chuỗi kết nối, không chỉ kiểm tra có hay không.
      #
      # Lý do: nút copy trên Neon đưa ra nguyên câu lệnh psql, kèm dấu nháy:
      #     psql 'postgresql://user:***@host/db?sslmode=require'
      # Dán nguyên vào secret thì Prisma chết với P1012 "URL must start with the
      # protocol postgresql://" — nhưng chỉ chết ở bước migrate, tức là sau khi
      # đã cài đặt và build xong, làm mất 30 giây và giấu nguyên nhân thật xuống
      # tận cuối log. Bắt ngay tại đây, ở giây thứ 5, với lời chỉ dẫn cụ thể.
      - name: Kiểm tra DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Chưa tạo secret DATABASE_URL. Settings → Secrets and variables → Actions."
            exit 1
          fi

          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *)
              # In 10 ký tự đầu để nhận diện lỗi. An toàn: 10 ký tự đầu của một
              # chuỗi hợp lệ chỉ là "postgresql", còn mật khẩu nằm sau dấu ':'
              # thứ hai, xa hơn nhiều. Log của repo public ai cũng đọc được nên
              # tuyệt đối không in thêm.
              echo "::error::DATABASE_URL sai định dạng — phải bắt đầu bằng 'postgresql://'. 10 ký tự đầu hiện tại: [$(printf '%s' "$DATABASE_URL" | cut -c1-10)]. Thường là do dán nguyên câu lệnh psql của Neon kèm dấu nháy. Dán lại chỉ phần chuỗi kết nối, bỏ 'psql ' và bỏ dấu nháy."
              exit 1 ;;
          esac

          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::warning::DATABASE_URL đang dùng chuỗi pooler. Prisma migrate cần kết nối TRỰC TIẾP; nếu bước migrate lỗi P1002 thì đổi sang chuỗi không có '-pooler'." ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Repo đã có pnpm-lock.yaml nên bật được cache, tiết kiệm ~40 giây/lần.
          cache: pnpm

      # --prod=false là BẮT BUỘC ở đây, không phải tuỳ chọn.
      #
      # `NODE_ENV: production` đặt ở cấp job (cần cho lúc chạy scraper) khiến pnpm
      # bỏ qua toàn bộ devDependencies. Mà `nest`, `prisma`, `tsc` đều nằm trong
      # devDependencies -> bước Build chết ngay với "Command \"nest\" not found",
      # kéo theo mọi bước sau bị skip. Đây chính là lý do 6/6 lần chạy đều đỏ và
      # cập nhật hằng ngày chưa từng chạy được lần nào.
      #
      # Cùng một cái bẫy đã làm hỏng build trên Vercel trước đây ("tsc: command
      # not found"). Không hạ NODE_ENV xuống vì scraper cần nó ở lúc chạy —
      # chỉ cần nói riêng với pnpm rằng bước CÀI ĐẶT thì vẫn lấy devDependencies.
      - name: Cài dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Cài Chromium (chỉ khi cần nguồn Playwright)
        if: inputs.with_playwright == true
        run: pnpm --filter @og/api exec playwright install --with-deps chromium

      - name: Build
        run: |
          pnpm --filter @og/shared build
          pnpm --filter @og/api exec prisma generate
          pnpm --filter @og/api build

      # An toàn khi chạy lặp: migration đã áp dụng rồi sẽ bị bỏ qua.
      - name: Đồng bộ schema database
        run: pnpm --filter @og/api exec prisma migrate deploy

      # Nạp countries/companies/skills/fx_rates. Idempotent (ON CONFLICT DO UPDATE).
      - name: Nạp dữ liệu nền
        working-directory: apps/api
        run: node dist/scripts/seed.js

      # continue-on-error: một nguồn chết KHÔNG được ngăn các bước sau chạy.
      # Bảo trì và báo cáo vẫn phải thực hiện, và báo cáo chính là thứ cho bạn
      # biết nguồn nào vừa hỏng.
      - name: Thu thập việc làm
        id: scrape
        if: ${{ !inputs.setup_only }}
        continue-on-error: true
        working-directory: apps/api
        run: node dist/scripts/scrape-cli.js ${{ inputs.source }}

      - name: Bảo trì (ẩn tin quá hạn + cập nhật tỉ giá)
        if: ${{ inputs.source == '' && !inputs.setup_only }}
        continue-on-error: true
        working-directory: apps/api
        run: node dist/scripts/maintenance-cli.js

      - name: Báo cáo kết quả
        if: ${{ !inputs.setup_only }}
        working-directory: apps/api
        run: node dist/scripts/report-cli.js >> "$GITHUB_STEP_SUMMARY"

      # Đánh dấu job đỏ nếu scrape lỗi — nhưng chỉ SAU khi báo cáo đã được ghi,
      # để bạn vẫn đọc được chuyện gì xảy ra.
      - name: Báo lỗi nếu bước thu thập thất bại
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Bước thu thập thất bại — xem bảng báo cáo ở phần Summary."
          exit 1
